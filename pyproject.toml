[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "file-integrity-monitor"
version = "1.0.0"
description = "A dependency-free educational file-integrity monitoring CLI"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
fim = "fim:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

